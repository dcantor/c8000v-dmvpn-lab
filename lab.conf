# Lab settings — sourced by lab.sh
LAB_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
LAB_NAME="c8000v-dmvpn-lab"
LIBVIRT_URI="qemu:///system"

# libvirt domain names are host-global, and vyos-dmvpn already owns hub-east/hub-central/hub-west/mpls. Every VM here
# is defined as <DOMAIN_PREFIX><node>; lab.conf, lab.sh, the tests and Nautobot all use the short node name.
DOMAIN_PREFIX="c8d-"

# Catalyst 8000v: three DMVPN hubs and three customer sites. The base image is never modified; every node boots from
# a qcow2 overlay on it.
C8000V_IMAGE="/home/dcantor/cat8000v-ipsec/c8000v-universalk9_16G_serial.17.15.06.qcow2"
C8000V_VCPU=2
C8000V_RAM_MIB=4096
# The simulated MPLS provider: one VyOS router (the base image cat8000v-ipsec built from the rolling ISO)
VYOS_IMAGE="/home/dcantor/cat8000v-ipsec/images/vyos-base.qcow2"
VYOS_VCPU=1
VYOS_RAM_MIB=1024
# LAN hosts: one Alpine VM behind every customer router (srv6-core/tools/build_host_image.sh): iperf3, tcpdump, mtr,
# node-exporter, user lab / lab
HOST_IMAGE="/home/dcantor/srv6-core/images/alpine-host.qcow2"
HOST_VCPU=1
HOST_RAM_MIB=256
# C8000v first boot is CPU-heavy: `lab.sh up` starts this many at a time and waits BOOT_STAGGER_S between batches
BOOT_BATCH=3
BOOT_STAGGER_S=90

# OOB management network (libvirt bridge, host is 10.5.0.1; the shared NMS joins as 10.5.0.10)
OOB_NET="c8d-oob"
OOB_GATEWAY="10.5.0.1"
OOB_PREFIX="10.5.0.0/24"
# the shared NMS (cat9000v lab) on this network: VictoriaMetrics (Telegraf push, :8428), VictoriaLogs (syslog, udp 5514),
# Prometheus scrapes the portal's /api/sd from here
NMS_IP="10.5.0.10"

# ---- the DMVPN service ------------------------------------------------------------------------------------------
# One Phase 3 cloud (hubs: redirect; customers: shortcut). Every customer registers with all three hubs.
DMVPN_AS=65100
DMVPN_OVERLAY="172.28.0.0/24"       # Tunnel0: <net>.<T_IDX>
DMVPN_NETWORK_ID=1
DMVPN_TUNNEL_KEY=100
DMVPN_HOLDTIME=300
DMVPN_MTU=1400
DMVPN_MSS=1360
DMVPN_PSK="lab-dmvpn-psk-do-not-use-outside-this-lab"     # a lab secret, deliberately in the clear like the rest of the lab
NHRP_SECRET="c8dnhrp"                                        # IOS truncates NHRP authentication to 8 characters
# BGP holds down fast, so a lost link is noticed in seconds rather than the default three minutes
BGP_KEEPALIVE=3
BGP_HOLDTIME=9

# ---- the provider -----------------------------------------------------------------------------------------------
# A single VyOS router plays the MPLS network: its own AS, one eBGP session per site through a listen range (so a new
# site never means editing the provider), as-override because every site is in AS 65100. It carries the sites' WAN
# addresses and nothing else — the customer LANs only ever cross it inside the tunnel.
PROVIDER_AS=65000
WAN_NET="100.70"                     # router <-> mpls: <WAN_NET>.<T_IDX>.0/30, mpls .1, the router .2 (the NBMA address)
ROUTER_ID_NET="10.255.5"             # Loopback0 / BGP router-id: <net>.<T_IDX>; the provider takes .254

# ---- the nodes --------------------------------------------------------------------------------------------------
declare -A ROLE=(    [hub-east]=hub [hub-central]=hub [hub-west]=hub
                     [cust1]=spoke [cust2]=spoke [cust3]=spoke
                     [mpls]=provider
                     [host-cust1]=host [host-cust2]=host [host-cust3]=host
                  [cust4]=spoke
                  [host-cust4]=host
                  [cust5]=spoke
                  [host-cust5]=host )
declare -A REGION=(  [hub-east]=East [hub-central]=Central [hub-west]=West
                     [cust1]=East [cust2]=Central [cust3]=West
                    [cust4]=East
                    [cust5]=Central )
declare -A MGMT_IP=( [hub-east]=10.5.0.11 [hub-central]=10.5.0.12 [hub-west]=10.5.0.13
                     [cust1]=10.5.0.21 [cust2]=10.5.0.22 [cust3]=10.5.0.23
                     [mpls]=10.5.0.31
                     [host-cust1]=10.5.0.41 [host-cust2]=10.5.0.42 [host-cust3]=10.5.0.43
                     [cust4]=10.5.0.24
                     [host-cust4]=10.5.0.44
                     [cust5]=10.5.0.25
                     [host-cust5]=10.5.0.45 )
# the one index a DMVPN router gets: third octet of its WAN /30, last octet of its tunnel address and router-id
declare -A T_IDX=(   [hub-east]=1 [hub-central]=2 [hub-west]=3
                     [cust1]=11 [cust2]=12 [cust3]=13
                   [cust4]=14
                   [cust5]=15 )
# the site LAN: a customer's Gi3 (.1) with its host behind it (.2); a hub's Loopback10 (it has no host)
declare -A LAN=(     [hub-east]=192.168.71.0/24 [hub-central]=192.168.72.0/24 [hub-west]=192.168.73.0/24
                     [cust1]=192.168.61.0/24 [cust2]=192.168.62.0/24 [cust3]=192.168.63.0/24
                 [cust4]=192.168.64.0/24
                 [cust5]=192.168.65.0/24 )
declare -A HOST_OF=( [cust1]=host-cust1 [cust2]=host-cust2 [cust3]=host-cust3 [cust4]=host-cust4 [cust5]=host-cust5 )
# the router platform of a hub or customer: c8000v (the default) or vyos. A VyOS customer is cabled like a C8000v one
# — port 2 to the provider, port 3 to its LAN (eth2 / eth3; eth1 and eth4 spare) — and interoperates with the hubs.
declare -A PLATFORM=( [cust4]=vyos [cust5]=c8000v )

# ---- the wiring -------------------------------------------------------------------------------------------------
# "A:portA B:portB prefix": the first end takes the first host address (.1), the second the second (.2), and the
# first end anchors the UDP socket pair — so the provider's domain XML never changes when a customer is added.
# Port numbers are the interface numbers: GigabitEthernetN on a C8000v, ethN on VyOS and Alpine.
LINKS=(
  # the provider: eth1-3 the hubs, eth4-11 up to eight customers, eth12 spare
  "mpls:1 hub-east:2 100.70.1.0/30"
  "mpls:2 hub-central:2 100.70.2.0/30"
  "mpls:3 hub-west:2 100.70.3.0/30"
  "mpls:4 cust1:2 100.70.11.0/30"
  "mpls:5 cust2:2 100.70.12.0/30"
  "mpls:6 cust3:2 100.70.13.0/30"
  # customer LANs: the router's Gi3 (.1) <-> its host's eth1 (.2)
  "cust1:3 host-cust1:1 192.168.61.0/24"
  "cust2:3 host-cust2:1 192.168.62.0/24"
  "cust3:3 host-cust3:1 192.168.63.0/24"
  # cust4: added by the portal
  "mpls:7 cust4:2 100.70.14.0/30"
  "cust4:3 host-cust4:1 192.168.64.0/24"
  # cust5: added by the portal
  "mpls:8 cust5:2 100.70.15.0/30"
  "cust5:3 host-cust5:1 192.168.65.0/24"
)

# ---- VM shape ---------------------------------------------------------------------------------------------------
declare -A CONSOLE_PORT=( [hub-east]=5501 [hub-central]=5502 [hub-west]=5503
                          [cust1]=5511 [cust2]=5512 [cust3]=5513
                          [mpls]=5521
                          [host-cust1]=5531 [host-cust2]=5532 [host-cust3]=5533
                          [cust4]=5514
                          [host-cust4]=5534
                          [cust5]=5515
                          [host-cust5]=5535 )
declare -A NODE_IDX=(     [hub-east]=1 [hub-central]=2 [hub-west]=3
                          [cust1]=11 [cust2]=12 [cust3]=13
                          [mpls]=21
                          [host-cust1]=31 [host-cust2]=32 [host-cust3]=33
                      [cust4]=14
                      [host-cust4]=34
                      [cust5]=15
                      [host-cust5]=35 )
MAC_OUI="52:54:00:c9"      # MACs 52:54:00:c9:<idx>:<port> (hex); srv6-core :c6, cat8000v-ipsec :c7, vyos-dmvpn :c8
UDP_BASE=46000             # UDP ports 46000 + idx*100 + port, far side +10000; clear of the other labs' ranges

# data ports per role. Every port exists in the VM whether or not it is wired, so wiring one later never changes the
# VM that anchors the link.
C8000V_PORTS=3             # Gi2 = WAN (to mpls), Gi3 = site LAN (customers; unwired on a hub), Gi4 spare
LAN_PORT=3
PROVIDER_PORTS=12          # eth1-3 hubs, eth4-11 customers, eth12 spare
HOST_PORTS=1

HUBS=(hub-east hub-central hub-west)
SPOKES=(cust1 cust2 cust3 cust4 cust5)
PROVIDERS=(mpls)
HOSTS=(host-cust1 host-cust2 host-cust3 host-cust4 host-cust5)
DMVPN_ROUTERS=("${HUBS[@]}" "${SPOKES[@]}")            # C8000v or VyOS: see PLATFORM
ROUTERS=("${DMVPN_ROUTERS[@]}" "${PROVIDERS[@]}")
ALL_NODES=("${PROVIDERS[@]}" "${DMVPN_ROUTERS[@]}" "${HOSTS[@]}")
